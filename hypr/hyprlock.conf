source = /home/$USER/.config/theme/hyprlock.conf

# A quiet surface works with both the charcoal and paper palettes.
background {
    monitor =
    color = $theme_bg_opaque
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $theme_accent
    font_size = 64
    font_family = VictorMono Nerd Font Mono
    shadow_passes = 0
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %m/%d"
    color = $theme_fg2
    font_size = 13
    font_family = VictorMono Nerd Font Mono
    shadow_passes = 0
    position = 0, 16
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 40
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    inner_color = $theme_bg
    outer_color = $theme_muted
    check_color = $theme_accent
    fail_color = $theme_accent
    font_color = $theme_fg
    font_family = VictorMono Nerd Font Mono
    fade_on_empty = false
    shadow_passes = 0
    rounding = 5
    placeholder_text = <span>输入密码</span>
    fail_text = <span>密码错误，请重试</span>
    position = 0, -64
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $theme_fg2
    font_size = 11
    font_family = VictorMono Nerd Font Mono
    shadow_passes = 0
    position = 0, 32
    halign = center
    valign = bottom
}
